name: Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.0.0
        required: true
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install exact model dependencies
        run: python -m pip install --target .training-deps -r requirements.txt
      - name: Compile launcher
        shell: pwsh
        run: ./Build-Launcher.ps1
      - name: Build and verify portable package
        env:
          PYTHONPATH: ${{ github.workspace }}/.training-deps
          MPLCONFIGDIR: ${{ runner.temp }}/form-matplotlib
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: FormStudio-Windows-x64
          path: |
            dist/FormStudio-Windows-x64.zip
            dist/FormStudio-Windows-x64.zip.sha256
      - name: Upload release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "FORM Studio $env:RELEASE_TAG" --notes "Windows x64: download and extract the entire ZIP, then open FormStudio.exe. Python, dependencies and model weights are included. Requires Microsoft Edge and a webcam."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $env:RELEASE_TAG dist/FormStudio-Windows-x64.zip dist/FormStudio-Windows-x64.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
